name: 오늘의 말씀 - 영상 생성

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      do_upload:
        description: '유튜브 업로드까지 진행 (체크 해제하면 로컬 생성만)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write   # 생성된 스크립트를 저장소에 다시 커밋하기 위해 필요

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ffmpeg / 한글 폰트 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 비밀 정보 복원 (GitHub Secrets → 실제 파일)
        run: |
          mkdir -p secrets
          echo "${{ secrets.YT_CLIENT_SECRETS_B64 }}" | base64 -d > secrets/client_secret.json
          echo "${{ secrets.YT_TOKEN_PICKLE_B64 }}" | base64 -d > secrets/token.pickle
          cat > .env << ENV_EOF
          UNSPLASH_KEY=${{ secrets.UNSPLASH_KEY }}
          PEXELS_KEY=${{ secrets.PEXELS_KEY }}
          PIXABAY_KEY=${{ secrets.PIXABAY_KEY }}
          OUTPUT_DIR=${{ github.workspace }}/outputs
          FONT_PATH=/usr/share/fonts/truetype/nanum/NanumGothicBold.ttf
          YT_UPLOAD=true
          SUBSCRIBE_TEXT=오늘의 은혜가 계속되기를 기도하며 [구독]하고 다음 말씀도 놓치지 마세요
          TTS_VOICE=ko-KR-SunHiNeural
          ENV_EOF

      - name: 업로드 여부 판단
        id: upload_flag
        run: |
          # 1순위: workflow_dispatch 로 수동 실행했을 때의 입력값
          # 2순위: 저장소에 커밋된 do_upload.flag 파일 (앱에서 커밋할 때 같이 씀)
          # 둘 다 없으면 기본값 true
          FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.do_upload }}" = "false" ]; then
              FLAG="--no-upload"
            fi
          elif [ -f do_upload.flag ] && [ "$(cat do_upload.flag | tr -d '[:space:]')" = "false" ]; then
            FLAG="--no-upload"
          fi
          echo "flag=$FLAG" >> "$GITHUB_OUTPUT"

      - name: 영상 생성 실행
        run: |
          cd src
          python main.py --input ../input.txt ${{ steps.upload_flag.outputs.flag }}

      - name: 결과물 다운로드용으로 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outputs
          path: outputs/
          retention-days: 14

      - name: 생성된 스크립트를 저장소에 영구 보관 (Suno 등에서 재사용)
        if: always()
        env:
          SCRIPTS_ARCHIVE_CLEANUP_DAYS: "30"   # 30일(약 1달) 지난 스크립트는 자동 삭제. 분기 단위면 90으로 변경
        run: |
          mkdir -p scripts_archive
          if [ -d outputs/scripts ]; then
            cp outputs/scripts/*.txt scripts_archive/ 2>/dev/null || true
          fi

          # 파일명(script_YYYY-MM-DD_시기.txt)에 박힌 날짜 기준으로 오래된 것 정리
          # (git 체크아웃 시 파일 수정시각이 매번 초기화되므로 파일 시스템 mtime 대신
          #  파일명 안의 날짜를 직접 파싱해서 판단함)
          python3 - << 'PY'
          import os, re, datetime as dt

          days = int(os.environ.get("SCRIPTS_ARCHIVE_CLEANUP_DAYS", "30"))
          cutoff = dt.date.today() - dt.timedelta(days=days)
          folder = "scripts_archive"
          removed = 0

          if os.path.isdir(folder):
              for fname in os.listdir(folder):
                  m = re.match(r"script_(\d{4}-\d{2}-\d{2})_", fname)
                  if not m:
                      continue
                  file_date = dt.date.fromisoformat(m.group(1))
                  if file_date < cutoff:
                      os.remove(os.path.join(folder, fname))
                      removed += 1

          print(f"[정리] {days}일 지난 스크립트 {removed}개 삭제")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts_archive
          if ! git diff --cached --quiet; then
            git commit -m "스크립트 보관/정리 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          else
            echo "변경된 스크립트가 없습니다."
          fi
